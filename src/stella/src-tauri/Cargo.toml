[package]
name = "stella"
version = "0.1.0"
description = "Arc compiler and runtime workbench"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "process", "io-util", "sync", "time", "fs"] }
regex = "1"
toml = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
